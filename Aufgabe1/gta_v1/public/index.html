<!DOCTYPE html>

<!-- File origin: VS1LAB A1a -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTagApp</title>
    <link rel="stylesheet" href="./stylesheets/style.css" />
</head>

<body>
    <header class="header">
        <img src="./images/location.png" class="header__image" alt="an image of a map and location">
        <h1 class="header__title">GeoTagApp</h1>
        <nav class="header__navigation">
            <a href="#">About</a> | <a href="#">Help</a> | <a href="/">Home</a>
        </nav>
    </header>

    <main class="main row">
        <section class="main__tagging tagging col-3">
            <h2>Tagging</h2>

            <!-- ############### VS1Lab 1a Form 1 Start -->
            <form id="tag-form" action="/tagging" method="post">

                <fieldset>
                    <legend>Add GeoTag</legend>

                    <label for="tag-latitude">Latitude</label>
                    <input type="text" id="tag-latitude" name="latitude" value="49.01379" placeholder="e.g. 49.01379" readonly required>

                    <label for="tag-longitude">Longitude</label>
                    <input type="text" id="tag-longitude" name="longitude" value="8.390071" placeholder="e.g. 8.390071" readonly required>

                    <label for="tag-name">Name</label>
                    <input type="text" id="tag-name" name="name" placeholder="e.g. Berlin" required maxlength="10" pattern="[A-Za-zÄÖÜäöüß]{1,10}" title="Required, letters only, at most 10 characters">

                    <label for="tag-hashtag">Hashtag</label>
                    <input type="text" id="tag-hashtag" name="hashtag" placeholder="e.g. #ber" maxlength="11" pattern="#[A-Za-zÄÖÜäöüß]{1,10}" title="Optional; starts with # followed by at most 10 letters">

                    <button type="submit" id="tag-submit">Add Tag</button>
                </fieldset>

            </form>
            <!-- ############### VS1Lab 1a Form 1 End -->

        </section>

        <section class="main__discovery discovery col-9">
            <h2 class="discovery__title">Discovery</h2>

            <!-- ############### VS1Lab 1a Form 2 Start -->
            <form class="discovery__search" id="discoveryFilterForm" action="/discovery" method="post">

                <fieldset>
                    <legend>Search GeoTags</legend>

                    <input type="hidden" id="discovery-latitude" name="latitude" value="49.01379">
                    <input type="hidden" id="discovery-longitude" name="longitude" value="8.390071">

                    <label for="discovery-searchterm">Search term or keywords</label>
                    <input type="text" id="discovery-searchterm" name="searchterm" placeholder="e.g. Berlin">

                    <button type="submit" id="Search">Search</button>
                </fieldset>

            </form>
            <!-- ############### VS1Lab 1a Form 2 End -->

            <div class="discovery__wrapper row">
                <div class="discovery__taglist col-3">
                    <ul class="discovery__results" id="discoveryResults">
                        <li>Castle (49.01379, 8.404435) #sight</li>
                        <li>IWI (49.01379, 8.390071) #edu</li>
                    </ul>
                </div>

                <div id="map" class="discovery__map col-9">
                    <img src="./images/mapview.jpg" alt="a map with locations" id="mapView" />
                    <span>Result map</span>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <span>(c) 2026 HKA_IWI_VSYS</span>
    </footer>
</body>

</html>
